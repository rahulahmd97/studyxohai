<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Page Not Found - StudyXohai</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f7f9fc;
            color: #1f2937;
        }

        .error-box {
            width: min(90%, 500px);
            text-align: center;

            background: #ffffff;

            padding: 45px 30px;

            border: 1px solid #e5e7eb;
            border-radius: 14px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .error-code {
            font-size: 72px;
            font-weight: 800;

            margin: 0;

            color: #174ea6;
        }

        h2 {
            margin: 10px 0;
            font-size: 24px;
        }

        p {
            color: #667085;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .home-button {
            display: inline-block;

            padding: 11px 24px;

            background: #174ea6;
            color: white;

            text-decoration: none;

            border-radius: 7px;

            font-weight: 600;

            transition: 0.2s;
        }

        .home-button:hover {
            background: #123d82;
        }

    </style>
</head>


<body>

    <div class="error-box">

        <h1 class="error-code">404</h1>

        <h2>Page Not Found</h2>

        <p>
            The page you are looking for may have been
            moved, renamed, or the link may be outdated.
        </p>

        <a href="/" class="home-button">
            🏠 Go to Home
        </a>

    </div>

</body>

</html>
